name: Bug report
description: Report a reproducible problem in the public code.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value:
        "Do not include credentials, operational coordinates, satellite
        products, candidate records, or reviewer evidence."
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened using synthetic or redacted inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
