name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Select pinned npm
        run: npm install --global npm@11.12.1 --ignore-scripts
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Verify pinned Node.js and npm versions
        run: npm run versions:check
      - name: Install locked Python development dependencies
        run: npm run setup:python
      - name: Run local quality command
        run: npm run check:quality
      - name: Audit dependencies
        run: npm run audit

  container-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate, build, and run the isolated worker
        run: |
          docker compose config
          docker compose build worker
          docker compose run --rm worker
